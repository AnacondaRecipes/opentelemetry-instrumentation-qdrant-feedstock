{% set name = "opentelemetry-instrumentation-qdrant" %}
{% set version = "0.57.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: a3cdcd975676cf0bd5fe3ec7397c1ef13ddba9a2ab8dd2f788c615c6d35e622f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0

test:
  source_files:
    - tests
  imports:
    - opentelemetry.instrumentation.qdrant
  commands:
    - pip check
    - pytest tests
  requires:
    - pip
    - qdrant-client
    - pytest

about:
  home: https://www.traceloop.com/openllmetry
  dev_url: https://github.com/traceloop/openllmetry
  doc_url: https://www.traceloop.com/docs/openllmetry/introduction
  summary: OpenTelemetry Qdrant instrumentation
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: This library allows tracing client-side calls to Qdrant vector DB sent with the official Qdrant client library.

extra:
  recipe-maintainers:
    - timkpaine
  skip-lints:
    - reachable_url
